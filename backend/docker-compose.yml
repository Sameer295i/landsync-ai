services:
  db:
    image: postgis/postgis:16-3.4
    container_name: landsync-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: landsync
      POSTGRES_PASSWORD: landsync
      POSTGRES_DB: landsync
    ports:
      - "5432:5432"
    volumes:
      - landsync_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U landsync"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    container_name: landsync-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://landsync:landsync@db:5432/landsync
      SECRET_KEY: change-this-secret-before-real-deployment
    ports:
      - "8000:8000"
    volumes:
      - ./uploads:/app/uploads

volumes:
  landsync_pgdata:
